<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Korean Lesson</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Serif+KR:wght@400;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2ECDC;
    --paper-2:#E9E1CC;
    --ink:#211F1C;
    --ink-soft:#5B564C;
    --celadon:#6E9887;
    --celadon-dark:#41594F;
    --dancheong:#AA3E35;
    --gold:#C08A2E;
    --line: rgba(33,31,28,0.16);
    --wrong-bg:#f3dcd9;
    --good-bg:#dcecdf;
  }
  [data-theme="noir"]{
    --paper:#181614;
    --paper-2:#242019;
    --ink:#F1EAD9;
    --ink-soft:#B9AF9C;
    --celadon:#7FB39E;
    --celadon-dark:#9FD6BE;
    --dancheong:#E0645A;
    --gold:#E3B25C;
    --line: rgba(241,234,217,0.16);
    --wrong-bg:#3a2521;
    --good-bg:#20332c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    line-height:1.5;
    transition:background .2s, color .2s;
  }
  #app{max-width:760px;margin:0 auto;padding:32px 24px 80px;}

  .hero{display:flex;align-items:center;gap:20px;margin-bottom:8px;}
  .hero-glyph{
    font-family:'Song Myung', serif;
    font-size:64px;
    color:var(--dancheong);
    line-height:1;
    flex-shrink:0;
  }
  .hero-text{flex:1;}
  .hero-text h1{
    font-family:'Song Myung', serif;
    font-weight:400;
    font-size:30px;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  .hero-text p{margin:0;color:var(--ink-soft);font-size:14px;}
  .theme-btn{
    background:none; border:1px solid var(--line); color:var(--ink-soft); cursor:pointer;
    padding:8px 14px; font-size:12.5px; font-family:'Work Sans'; align-self:flex-start;
  }
  .theme-btn:hover{border-color:var(--ink-soft);}

  .stats-row{
    display:flex; gap:0; margin:28px 0 20px;
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  }
  .stat{flex:1; padding:14px 6px; text-align:center; border-right:1px solid var(--line);}
  .stat:last-child{border-right:none;}
  .stat .num{font-family:'Song Myung', serif; font-size:26px; color:var(--celadon-dark); display:block;}
  .stat .lbl{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

  nav.tabs{display:flex; gap:22px; margin-bottom:28px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  nav.tabs button{
    background:none; border:none; cursor:pointer;
    font-family:'Work Sans'; font-size:14px; color:var(--ink-soft);
    padding:0 0 10px; position:relative; font-weight:500;
  }
  nav.tabs button.active{color:var(--ink);}
  nav.tabs button.active::after{
    content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--dancheong);
  }

  section{display:none;}
  section.active{display:block;}

  h2.section-title{
    font-family:'Song Myung', serif; font-weight:400; font-size:20px; margin:0 0 4px;
  }
  p.section-sub{color:var(--ink-soft); font-size:13.5px; margin:0 0 22px;}

  /* Hangul grid */
  .hgrid{display:grid; grid-template-columns:repeat(5, 1fr); gap:10px;}
  .hcell{
    border:1px solid var(--line); padding:14px 4px; text-align:center; cursor:pointer;
    background:var(--paper-2); transition:background .15s;
  }
  .hcell:hover{border-color:var(--ink-soft);}
  .hcell .kr{font-family:'Noto Serif KR', serif; font-size:26px; display:block;}
  .hcell .rom{font-size:11px; color:var(--ink-soft); margin-top:4px; display:block; min-height:14px;}
  .hcell.mastered{border-color:var(--celadon-dark); background:var(--good-bg);}

  .hquiz-box{border:1px solid var(--line); padding:26px; text-align:center; margin-top:18px;}
  .hquiz-char{font-family:'Noto Serif KR', serif; font-size:56px; margin-bottom:18px;}
  .hquiz-options{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; max-width:360px; margin:0 auto;}
  .opt-btn{
    padding:11px; border:1px solid var(--line); background:var(--paper); cursor:pointer;
    font-family:'Work Sans'; font-size:14px; color:var(--ink);
  }
  .opt-btn:hover{border-color:var(--ink-soft);}
  .opt-btn.correct{background:var(--good-bg); border-color:var(--celadon-dark); color:var(--celadon-dark);}
  .opt-btn.wrong{background:var(--wrong-bg); border-color:var(--dancheong); color:var(--dancheong);}

  /* Vocab */
  .box-tracker{display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap;}
  .box-pip{flex:1; min-width:60px; text-align:center; padding:8px 4px; border:1px solid var(--line); background:var(--paper-2);}
  .box-pip .n{font-family:'Song Myung',serif; font-size:18px; display:block;}
  .box-pip .l{font-size:10.5px; color:var(--ink-soft);}

  .flashcard{
    border:1px solid var(--line); min-height:220px; display:flex; align-items:center; justify-content:center;
    flex-direction:column; cursor:pointer; text-align:center; padding:30px 20px; background:var(--paper-2);
    position:relative;
  }
  .flashcard .front-kr{font-family:'Noto Serif KR', serif; font-size:42px; margin-bottom:10px;}
  .flashcard .front-rom{color:var(--ink-soft); font-size:14px;}
  .flashcard .back-en{font-family:'Song Myung',serif; font-size:26px; display:none;}
  .flashcard .tap-hint{position:absolute; bottom:10px; font-size:11px; color:var(--ink-soft);}
  .flashcard.flipped .front-kr, .flashcard.flipped .front-rom{display:none;}
  .flashcard.flipped .back-en{display:block;}
  .replay-btn{
    margin-top:10px; background:none; border:1px solid var(--line); padding:6px 14px;
    font-size:12px; cursor:pointer; color:var(--ink-soft);
  }

  .grade-row{display:flex; gap:10px; margin-top:16px;}
  .grade-btn{flex:1; padding:12px; border:1px solid var(--line); background:var(--paper); cursor:pointer; font-size:13.5px;}
  .grade-btn.again{color:var(--dancheong); border-color:var(--dancheong);}
  .grade-btn.again:hover{background:var(--wrong-bg);}
  .grade-btn.good{color:var(--celadon-dark); border-color:var(--celadon-dark);}
  .grade-btn.good:hover{background:var(--good-bg);}
  .grade-btn:disabled{opacity:0.4; cursor:default;}

  .deck-empty{text-align:center; padding:50px 20px; color:var(--ink-soft);}
  .deck-empty .n{font-family:'Song Myung',serif; font-size:20px; color:var(--celadon-dark); display:block; margin-bottom:8px;}

  /* Quiz */
  .quiz-progress{font-size:12.5px; color:var(--ink-soft); margin-bottom:14px;}
  .quiz-card{border:1px solid var(--line); padding:30px; text-align:center;}
  .quiz-prompt-kr{font-family:'Noto Serif KR', serif; font-size:40px; margin-bottom:6px;}
  .quiz-prompt-rom{color:var(--ink-soft); font-size:13px; margin-bottom:20px;}
  .quiz-options{display:grid; gap:9px; max-width:380px; margin:0 auto;}
  .quiz-result{text-align:center; padding:40px 20px;}
  .quiz-result .score{font-family:'Song Myung',serif; font-size:40px; color:var(--celadon-dark);}
  .btn-main{
    background:var(--ink); color:var(--paper); border:none; padding:11px 22px; cursor:pointer;
    font-family:'Work Sans'; font-size:14px; margin-top:18px;
  }
  .btn-main:hover{background:var(--celadon-dark);}
  .btn-ghost{background:none; border:1px solid var(--line); padding:10px 18px; cursor:pointer; font-size:13.5px; color:var(--ink);}
  .preset-btn.on{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  .row-between{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
  .toggle-dir{display:flex; border:1px solid var(--line);}
  .toggle-dir button{border:none; background:var(--paper); padding:7px 12px; font-size:12.5px; cursor:pointer; color:var(--ink-soft);}
  .toggle-dir button.on{background:var(--ink); color:var(--paper);}

  .papago-wrap{width:100%; overflow:hidden; border:1px solid var(--line); margin-top:18px; position:relative;}
  .papago-frame{width:1400px; height:620px; border:none; display:block; transform-origin:top left;}

  /* Sentences & Grammar */
  .phrase-row{
    border:1px solid var(--line); padding:14px 16px; margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:center; gap:12px;
  }
  .phrase-kr{font-family:'Noto Serif KR', serif; font-size:19px;}
  .phrase-rom{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .phrase-en{font-size:13px; color:var(--ink-soft); margin-top:2px; display:none;}
  .phrase-row.revealed .phrase-en{display:block;}
  .icon-btn{
    background:none; border:1px solid var(--line); width:36px; height:36px; flex-shrink:0;
    cursor:pointer; font-size:15px; color:var(--ink-soft);
  }
  .icon-btn:hover{border-color:var(--ink-soft);}

  .grammar-card{border:1px solid var(--line); padding:18px 20px; margin-bottom:14px;}
  .grammar-card h3{font-family:'Song Myung',serif; font-weight:400; font-size:17px; margin:0 0 8px;}
  .grammar-card p{font-size:13.5px; color:var(--ink-soft); margin:0 0 12px;}
  .grammar-example{border-top:1px solid var(--line); padding-top:10px; display:flex; justify-content:space-between; align-items:center; gap:12px;}
  .grammar-example .kr{font-family:'Noto Serif KR', serif; font-size:17px;}
  .grammar-example .sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}

  /* Achievements */
  .ach-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:10px; margin-top:22px;}
  .ach-badge{border:1px solid var(--line); padding:12px 10px; text-align:center; opacity:0.35;}
  .ach-badge.unlocked{opacity:1; border-color:var(--gold); background:var(--paper-2);}
  .ach-badge .glyph{font-family:'Song Myung',serif; font-size:20px; color:var(--gold); display:block; margin-bottom:4px;}
  .ach-badge .lbl{font-size:11px; color:var(--ink-soft);}
</style>

const STORAGE_KEY = 'hanjipages-progress';

async function storageGet(key){
  if(window.storage && window.storage.get){
    try{ const r = await window.storage.get(key,false); return r ? r.value : null; }catch(e){}
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  if(window.storage && window.storage.set){
    try{ await window.storage.set(key, value, false); return; }catch(e){}
  }
  try{ localStorage.setItem(key, value); }catch(e){}
}

let hasKoreanVoice = null;

const VOICE_PRESETS = [
  {id:'bright', label:'Bright and cheerful', pitch:1.35, rate:1.0},
  {id:'calm', label:'Calm and warm', pitch:1.05, rate:0.78}

function koreanVoices(){
  if(!('speechSynthesis' in window)) return [];
  return window.speechSynthesis.getVoices().filter(v=>v.lang && v.lang.startsWith('ko'));
}
function isMaleVoiceName(name){
  const maleHints = ['male','man','boy','minho','junho','minsu','david','mark','james','tom','paul','daniel'];
  const n = name.toLowerCase();
  return maleHints.some(h=>n.includes(h));
}
function femaleVoices(){
  const all = koreanVoices();
  const filtered = all.filter(v=>!isMaleVoiceName(v.name));
  return filtered.length ? filtered : all;
}
function pickDefaultVoice(voices){
  if(voices.length===0) return null;
  const femaleHints = ['female','heami','yuna','yumi','seoyeon','woman','girl'];
  const guess = voices.find(v=>femaleHints.some(h=>v.name.toLowerCase().includes(h)));
  return guess ? guess.voiceURI : voices[0].voiceURI;
}
function speakKorean(text){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    u.rate = state.rate;
    u.pitch = state.pitch;
    const voices = femaleVoices();
    if(!state.voiceURI) state.voiceURI = pickDefaultVoice(voices);
    const chosen = voices.find(v=>v.voiceURI===state.voiceURI);
    if(chosen) u.voice = chosen;
    if(musicPlaying && musicGain){
      const now = audioCtx.currentTime;
      musicGain.gain.cancelScheduledValues(now);
      musicGain.gain.linearRampToValueAtTime(state.musicVolume*0.3, now+0.3);
      u.onend = ()=>{
        const t = audioCtx.currentTime;
        musicGain.gain.cancelScheduledValues(t);
        musicGain.gain.linearRampToValueAtTime(state.musicVolume, t+0.6);
      };
      u.onerror = u.onend;
    }
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function checkKoreanVoice(){
  if(!('speechSynthesis' in window)){ hasKoreanVoice = false; return; }
  const voices = window.speechSynthesis.getVoices();
  if(voices.length === 0) return;
  const krVoices = koreanVoices();
  hasKoreanVoice = krVoices.length > 0;
  const fVoices = femaleVoices();
  const stillValid = state.voiceURI && fVoices.some(v=>v.voiceURI===state.voiceURI);
  if(hasKoreanVoice && !stillValid) state.voiceURI = pickDefaultVoice(fVoices);
  render();
}
if('speechSynthesis' in window){
  checkKoreanVoice();
  window.speechSynthesis.onvoiceschanged = checkKoreanVoice;
}

let audioCtx=null, musicGain=null, musicIntervalId=null, musicPlaying=false, musicStep=0;

const MUSIC_PATTERN = [523.25, 659.25, 783.99, 659.25, 880.00, 783.99, 659.25, 523.25];

function ensureAudioCtx(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    musicGain = audioCtx.createGain();
    musicGain.gain.value = state.musicVolume;
    musicGain.connect(audioCtx.destination);
  }
}
function pluckNote(freq, when, dur){
  const osc = audioCtx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(0.9, when+0.015);
  g.gain.exponentialRampToValueAtTime(0.001, when+dur);
  osc.connect(g);
  g.connect(musicGain);
  osc.start(when);
  osc.stop(when+dur+0.05);
}
function stopMusicNodes(){
  if(musicIntervalId){ clearInterval(musicIntervalId); musicIntervalId=null; }
}
function startMusic(){
  ensureAudioCtx();
  if(audioCtx.state==='suspended') audioCtx.resume();
  stopMusicNodes();
  musicStep = 0;
  const stepMs = 260;
  const playStep = ()=>{
    const freq = MUSIC_PATTERN[musicStep % MUSIC_PATTERN.length];
    pluckNote(freq, audioCtx.currentTime, stepMs/1000*0.85);
    musicStep++;
  };
  playStep();
  musicIntervalId = setInterval(playStep, stepMs);
  musicPlaying = true;
}
function stopMusic(){ stopMusicNodes(); musicPlaying = false; }
function toggleMusic(){ if(musicPlaying) stopMusic(); else startMusic(); render(); }
function setMusicVolume(v){
  state.musicVolume = v;
  if(musicGain && musicPlaying) musicGain.gain.value = v;
  saveState();
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function shuffle(arr){ return [...arr].sort(()=>Math.random()-0.5); }
function sample(arr,n){ return shuffle(arr).slice(0,n); }

async function loadState(){
  try{
    const raw = await storageGet(STORAGE_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      state = Object.assign(state, saved);
      state.achievements = saved.achievements || {};
      VOCAB.forEach((_,i)=>{ if(!(i in state.vocabBox)) state.vocabBox[i]=0; });
    }
  }catch(e){}
  document.body.dataset.theme = state.theme;
  bumpStreak();
  checkAchievements();
  render();
}
async function saveState(){
  try{ await storageSet(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function bumpStreak(){
  const today = todayStr();
  if(state.lastActive === today) return;
  const yest = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(state.lastActive === yest){ state.streak += 1; }
  else{ state.streak = 1; }
  state.lastActive = today;
  saveState();
}

function masteredHangulCount(){ return Object.values(state.hangulSeen).filter(v=>v>=2).length; }
function boxCounts(){

  return c;
}
function masteredVocabCount(){ return Object.values(state.vocabBox).filter(b=>b>=5).length; }

function startHangulQuiz(){
  const pool = sample(HANGUL, HANGUL.length);
  const target = pool[0];
  const wrong = sample(HANGUL.filter(h=>h.rom!==target.rom),3).map(h=>h.rom);
  const options = shuffle([target.rom, ...wrong]);
  hquiz = { target, options, answered:false };
}
function answerHangul(rom, btn){
  if(hquiz.answered) return;
  hquiz.answered = true;
  const correct = rom === hquiz.target.rom;
  state.hangulSeen[hquiz.target.kr] = (state.hangulSeen[hquiz.target.kr]||0) + (correct?1:0);
  saveState();
  checkAchievements();
  document.querySelectorAll('.opt-btn').forEach(b=>{
    if(b.dataset.rom === hquiz.target.rom) b.classList.add('correct');
    else if(b===btn) b.classList.add('wrong');
  });
  setTimeout(()=>{ startHangulQuiz(); render(); }, 700);
}

function buildFlashDeck(){
  const weighted = [];
  VOCAB.forEach((w,i)=>{
    const box = state.vocabBox[i]||0;
    const weight = Math.max(1, 5-box);
    for(let k=0;k<weight;k++) weighted.push(i);
  });
  flashDeck = shuffle(weighted).filter((v,i,a)=>a.indexOf(v)===i).slice(0,12);
  if(flashDeck.length===0) flashDeck = sample(Object.keys(VOCAB).map(Number),8);
  flashIdx = 0; flashFlipped = false;
}
function flipCard(){
  flashFlipped = true;
  const idx = flashDeck[flashIdx];
  speakKorean(VOCAB[idx].kr);
  render();
}
function gradeCard(good){
  const idx = flashDeck[flashIdx];
  if(good) state.vocabBox[idx] = Math.min(5,(state.vocabBox[idx]||0)+1);
  else state.vocabBox[idx] = Math.max(0,(state.vocabBox[idx]||0)-1);
  saveState();
  checkAchievements();
  flashIdx++;
  flashFlipped=false;
  render();
}

function startQuiz(){
  const dir = state.quizDir;
  const items = sample(VOCAB.map((v,i)=>i), Math.min(8, VOCAB.length));
  const questions = items.map(i=>{
    const word = VOCAB[i];
    const distractors = sample(VOCAB.filter((_,j)=>j!==i), 3);
    const correctText = dir==='kr-en' ? word.en : word.kr;
    const opts = shuffle([correctText, ...distractors.map(d=> dir==='kr-en'? d.en : d.kr)]);
    return { word, opts, correct: correctText, answered:false, picked:null };
  });
  quizSession = { questions, idx:0, score:0, done:false };
  if(dir==='kr-en') speakKorean(questions[0].word.kr);
}
function pickQuizOption(opt){
  const q = quizSession.questions[quizSession.idx];
  if(q.answered) return;
  q.answered = true; q.picked = opt;
  if(opt===q.correct) quizSession.score++;
  setTimeout(()=>{
    if(quizSession.idx < quizSession.questions.length-1){
      quizSession.idx++;
      const nq = quizSession.questions[quizSession.idx];
      if(state.quizDir==='kr-en') speakKorean(nq.word.kr);
    } else {
      quizSession.done = true;
      if(quizSession.score===quizSession.questions.length){ state.hadPerfectQuiz = true; saveState(); }
      checkAchievements();
    }
    render();
  }, 550);
  render();
}

      <div class="toggle-dir">
        <button class="${dir==='ko-en'?'on':''}" id="tr-dir-ko-en">한글 → EN</button>
        <button class="${dir==='en-ko'?'on':''}" id="tr-dir-en-ko">EN → 한글</button>
      </div>
    </div>
    <div class="papago-wrap" id="papago-wrap">
      <iframe id="papago-frame" class="papago-frame" src="${papagoUrl()}" title="Naver Papago translation"></iframe>
    </div>
  `;
}

function sizePapagoFrame(){
  const wrap = document.getElementById('papago-wrap');
  const frame = document.getElementById('papago-frame');
  if(!wrap || !frame) return;
  const nativeW = 1400, nativeH = 620;
  const scale = wrap.clientWidth / nativeW;
  frame.style.transform = `scale(${scale})`;
  wrap.style.height = (nativeH * scale) + 'px';
}

function wireDynamic(){
  const g = id => document.getElementById(id);
  if(g('theme-toggle')) g('theme-toggle').onclick = toggleTheme;
  if(g('music-toggle')) g('music-toggle').onclick = toggleMusic;
  if(g('music-volume')) g('music-volume').oninput = (e)=> setMusicVolume(parseFloat(e.target.value));
  if(g('go-hangul-quiz')) g('go-hangul-quiz').onclick = ()=> setView('hangul-quiz');
  if(g('go-hangul-quiz-2')) g('go-hangul-quiz-2').onclick = ()=> setView('hangul-quiz');
  if(g('go-vocab')) g('go-vocab').onclick = ()=> setView('vocab');
  if(g('go-sentences')) g('go-sentences').onclick = ()=> setView('sentences');
  if(g('go-grammar')) g('go-grammar').onclick = ()=> setView('grammar');
  if(g('go-quiz')) g('go-quiz').onclick = ()=> setView('quiz');
  if(g('back-hangul')) g('back-hangul').onclick = ()=> setView('hangul');
  if(g('restart-deck')) g('restart-deck').onclick = ()=>{ buildFlashDeck(); render(); };
  if(g('flash-card')) g('flash-card').onclick = ()=>{ if(!flashFlipped) flipCard(); };
  if(g('replay-word')) g('replay-word').onclick = ()=>{ const idx=flashDeck[flashIdx]; speakKorean(VOCAB[idx].kr); };
  if(g('grade-again')) g('grade-again').onclick = ()=> gradeCard(false);
  if(g('grade-good')) g('grade-good').onclick = ()=> gradeCard(true);
  if(g('dir-kr-en')) g('dir-kr-en').onclick = ()=> setDir('kr-en');
  if(g('dir-en-kr')) g('dir-en-kr').onclick = ()=> setDir('en-kr');
  if(g('start-quiz-btn')) g('start-quiz-btn').onclick = ()=>{ startQuiz(); render(); };
  if(g('quiz-again')) g('quiz-again').onclick = ()=>{ quizSession=null; render(); };
  if(g('quiz-replay')) g('quiz-replay').onclick = ()=>{ const q=quizSession.questions[quizSession.idx]; speakKorean(q.word.kr); };

  if(g('tr-dir-ko-en')) g('tr-dir-ko-en').onclick = ()=>{ translateState.dir='ko-en'; render(); };
  if(g('tr-dir-en-ko')) g('tr-dir-en-ko').onclick = ()=>{ translateState.dir='en-ko'; render(); };

  if(g('voice-select')) g('voice-select').onchange = (e)=>{ state.voiceURI = e.target.value; saveState(); };
  if(g('pitch-slider')) g('pitch-slider').oninput = (e)=>{ state.pitch = parseFloat(e.target.value); saveState(); render(); };
  if(g('rate-slider')) g('rate-slider').oninput = (e)=>{ state.rate = parseFloat(e.target.value); saveState(); render(); };
  if(g('test-voice')) g('test-voice').onclick = ()=> speakKorean('안녕하세요');
  document.querySelectorAll('.preset-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const p = VOICE_PRESETS.find(x=>x.id===btn.dataset.preset);
      if(p){ state.pitch = p.pitch; state.rate = p.rate; saveState(); speakKorean('안녕하세요'); render(); }
    };
  });

  document.querySelectorAll('.hcell').forEach(cell=>{
    cell.onclick = ()=>{
      const kr = cell.dataset.kr;
      const h = HANGUL.find(x=>x.kr===kr);
      const romSpan = cell.querySelector('.rom');
      romSpan.textContent = h.rom;
      speakKorean(h.kr);
    };
  });
  document.querySelectorAll('.hquiz-options .opt-btn').forEach(btn=>{
    btn.onclick = ()=> answerHangul(btn.dataset.rom, btn);
  });
  document.querySelectorAll('.quiz-options .opt-btn').forEach(btn=>{
    btn.onclick = ()=> pickQuizOption(decodeURIComponent(btn.dataset.opt));
  });
  document.querySelectorAll('.phrase-toggle').forEach(el=>{
    el.onclick = ()=> togglePhrase(parseInt(el.dataset.i,10));
  });
  document.querySelectorAll('[data-say]').forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); speakKorean(decodeURIComponent(btn.dataset.say)); };
  });
}

loadState();
</script>
</body>
</html>
